<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OfficialDoc Portal</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='46' fill='none' stroke='%239C2126' stroke-width='7'/%3E%3Cpath d='M50 18l7 15 16 2-11.5 11 3 16-14.5-7.6-14.5 7.6 3-16-11.5-11 16-2z' fill='%239C2126'/%3E%3C/svg%3E">
<style id="css-app">
:root{
  --accent:#9C2126; --accent-deep:#7c1a1f; --accent-soft:#f7ecec;
  --ink:#1c1f24; --ink-2:#454b54; --muted:#8a919c;
  --line:#e4e7eb; --line-strong:#c9ced6;
  --bg:#f2f3f5; --panel:#ffffff;
  --radius:12px;
  --shadow-sm:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-md:0 6px 20px rgba(16,24,40,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);overflow:hidden}
button{font-family:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#cfd4db;border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:#b6bcc5;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 顶栏 ---------- */
.topbar{height:58px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 16px;position:relative;z-index:20}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand-mark{width:32px;height:32px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#6d1418);color:#fff;display:grid;place-items:center;font-weight:700;font-size:15px;box-shadow:var(--shadow-sm)}
.brand-name{font-weight:700;font-size:14.5px;letter-spacing:.2px;white-space:nowrap}
.brand-sub{font-weight:500;color:var(--ink-2);font-size:12px;margin-left:2px}
.brand-dept{font-size:10.5px;color:var(--muted);margin-top:1px;letter-spacing:.4px;white-space:nowrap}
.ver{font-size:10px;border:1px solid var(--line-strong);border-radius:99px;padding:1.5px 8px;color:var(--muted);white-space:nowrap;flex:none}
.typebar{flex:1;display:flex;gap:6px;overflow-x:auto;min-width:0;scrollbar-width:none;padding:2px}
.typebar::-webkit-scrollbar{display:none}
.pill{flex:none;border:1px solid var(--line-strong);background:#fff;border-radius:99px;padding:5px 14px;font-size:12.5px;cursor:pointer;color:var(--ink-2);transition:all .18s ease;white-space:nowrap}
.pill:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.pill.active{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.pill.active:hover{background:var(--accent-deep);color:#fff}
.actions{display:flex;gap:7px;align-items:center;flex:none}
.btn{height:31px;border-radius:99px;border:1px solid var(--line-strong);background:#fff;padding:0 12px;font-size:12px;cursor:pointer;color:var(--ink-2);transition:all .18s ease;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px);box-shadow:var(--shadow-sm)}
.btn:active{transform:translateY(0)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600;padding:0 16px}
.btn.primary:hover{background:var(--accent-deep);color:#fff}
.btn.mt{border-color:var(--accent);color:var(--accent);font-weight:600}
.btn.mt:hover{background:var(--accent-soft)}
.btn.mt:disabled{opacity:.55;cursor:default;pointer-events:none}

/* ---------- 主区 ---------- */
.main{display:grid;grid-template-columns:472px 1fr;height:calc(100% - 58px)}
.editor{overflow-y:auto;padding:16px 16px 70px;border-right:1px solid var(--line);background:var(--bg)}
.preview-wrap{overflow:auto;position:relative;padding:26px 0 70px;background:radial-gradient(circle at 1px 1px,#dcdfe5 1px,transparent 0) 0 0/22px 22px,var(--bg)}
.pv-toolbar{position:absolute;top:14px;right:16px;z-index:10;display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.93);backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:99px;padding:5px 8px 5px 10px;box-shadow:var(--shadow-md)}
.seg{display:inline-flex;background:#f1f2f4;border-radius:99px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 12px;border-radius:99px;font-size:12px;cursor:pointer;color:var(--ink-2);transition:all .15s}
.seg button.on{background:#fff;box-shadow:var(--shadow-sm);color:var(--accent);font-weight:600}
.zoom{display:flex;align-items:center;gap:2px}
.zoom button{border:0;background:transparent;width:24px;height:24px;border-radius:7px;cursor:pointer;color:var(--ink-2);font-size:14px;line-height:1;transition:.15s}
.zoom button:hover{background:var(--accent-soft);color:var(--accent)}
#zoomLabel{font-size:11px;color:var(--muted);min-width:38px;text-align:center;font-variant-numeric:tabular-nums}
.zoom .fit-btn{width:auto;padding:0 8px;font-size:11.5px}
.pv-toolbar .mt-btn{border:1px solid var(--line-strong);background:#fff;border-radius:99px;padding:4px 12px;font-size:12px;cursor:pointer;color:var(--ink-2);transition:all .15s;white-space:nowrap}
.pv-toolbar .mt-btn:hover{border-color:var(--accent);color:var(--accent)}
.pv-toolbar .mt-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.paper-sizer{position:relative;margin:0 auto;animation:fadeUp .3s ease}
@keyframes fadeUp{from{opacity:0}to{opacity:1}}

/* ---------- 编辑器卡片 ---------- */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);margin-bottom:14px;box-shadow:var(--shadow-sm);overflow:hidden;animation:fadeUp .25s ease}
.card-h{display:flex;align-items:baseline;gap:9px;padding:11px 14px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#fff,#fbfbfc);cursor:default}
.card-t{font-size:13px;font-weight:700;letter-spacing:.5px;display:flex;align-items:center;gap:7px}
.card-t::before{content:"";width:3px;height:12px;background:var(--accent);border-radius:2px}
.card-hint{font-size:11px;color:var(--muted);margin-left:auto;text-align:right}
.card-b{padding:13px 14px;display:flex;flex-direction:column;gap:11px}
details.card>summary.card-h{list-style:none;cursor:pointer}
details.card>summary.card-h::-webkit-details-marker{display:none}
details.card>summary.card-h::after{content:"▸";color:var(--muted);font-size:11px;margin-left:8px;transition:transform .2s}
details.card[open]>summary.card-h::after{transform:rotate(90deg)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld-l{font-size:11.5px;color:var(--ink-2);font-weight:600;display:flex;align-items:center}
.en-h{font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 3px;margin-left:5px;font-weight:400;line-height:1.4}
input[type=text],input[type=date],input[type=time],textarea{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:7px 10px;font-size:13px;font-family:inherit;background:#fff;color:var(--ink);transition:border-color .15s,box-shadow .15s}
input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(156,33,38,.12)}
textarea{resize:vertical;min-height:72px;line-height:1.65}
.en-in{margin-top:3px;font-size:12px;background:#fcfcfd}
.in-row{display:flex;align-items:center;gap:7px;min-width:0}
.in-row input,.in-row textarea{flex:1}
.lang-chip{flex:none;font-size:9.5px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-weight:600;letter-spacing:.3px;line-height:1.5}
.title-sub-zh{font-family:"Noto Serif SC",serif;text-transform:none;letter-spacing:.15em}
.org-name-zhsub{font-size:10.5px;letter-spacing:1.5px;color:#5a6068;margin-top:3px;font-family:"Noto Serif SC",serif}
.org-dept .dept-en{font-size:9.5px;color:#b07a7d;margin-left:8px;letter-spacing:1.5px;font-weight:500}
.sig-org .dept-en{font-size:10px;color:#7a8088;font-weight:500;letter-spacing:1px;margin-left:8px}
.no-row{display:flex;gap:8px}
.no-row input{flex:1}
.mini-btn{border:1px solid var(--line-strong);background:#fff;border-radius:8px;padding:6px 11px;font-size:11.5px;cursor:pointer;color:var(--ink-2);transition:all .15s;white-space:nowrap}
.mini-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.mini-btn.danger:hover{border-color:#b42318;color:#b42318;background:#fef3f2}
.sub-h{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:1.5px;display:flex;align-items:center;gap:8px;margin:2px 0 -2px}
.title-preview{font-family:"Noto Serif SC","Source Han Serif SC","SimSun",serif;font-weight:700;font-size:15.5px;text-align:center;padding:11px 14px;background:#faf7f6;border:1px dashed #d9c8c3;border-radius:8px;color:#3a3f45;letter-spacing:.04em;line-height:1.55}
.title-preview-en{font-family:Georgia,"Times New Roman",serif;font-size:10.5px;text-align:center;padding:7px 14px 0;color:#8a9098;letter-spacing:.09em;text-transform:uppercase;line-height:1.55}
.title-actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.hint-inline{font-size:11px;color:var(--muted)}
.auto-tag{font-size:9.5px;font-weight:400;color:var(--accent);background:#fbeef0;border:1px solid #eed0d3;border-radius:99px;padding:1px 8px;margin-left:7px;letter-spacing:.08em}
.sub-h::after{content:"";flex:1;height:1px;background:var(--line)}
.rows{display:flex;flex-direction:column;gap:9px}
.row{display:grid;gap:9px;align-items:end;position:relative;padding:10px 36px 10px 11px;border:1px solid var(--line);border-radius:10px;background:#fcfcfd;animation:fadeUp .2s ease}
.row .del{position:absolute;top:7px;right:7px;width:22px;height:22px;border-radius:50%;border:1px solid var(--line-strong);background:#fff;color:var(--muted);cursor:pointer;line-height:1;font-size:13px;display:grid;place-items:center;transition:all .15s;padding:0}
.row .del:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.row.r2{grid-template-columns:1fr 1fr}
.row.r3{grid-template-columns:1.2fr 1.5fr .7fr}
.row.r4{grid-template-columns:.55fr 1.15fr 1fr 1fr}
.row.r1{grid-template-columns:1fr}
.add-btn{width:100%;border:1px dashed var(--line-strong);background:#fff;border-radius:10px;padding:8px;color:var(--ink-2);cursor:pointer;font-size:12.5px;transition:all .15s}
.add-btn:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.pen-pills{display:flex;flex-wrap:wrap;gap:6px}
.pen-pill{border:1px solid var(--line-strong);background:#fff;border-radius:99px;padding:5px 12px;font-size:12px;cursor:pointer;color:var(--ink-2);transition:all .15s}
.pen-pill:hover{border-color:var(--accent);color:var(--accent)}
.pen-pill.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:500}
.editor-tip{font-size:11px;color:var(--muted);line-height:1.8;text-align:center;padding:6px 20px 0}

/* ---------- 草稿箱弹窗 ---------- */
.modal-mask{position:fixed;inset:0;background:rgba(15,18,24,.45);display:grid;place-items:center;z-index:90;padding:20px}
.modal-mask[hidden]{display:none}
.modal{background:#fff;border-radius:14px;width:540px;max-width:100%;max-height:80vh;display:flex;flex-direction:column;box-shadow:0 24px 60px rgba(0,0,0,.25);animation:pop .25s ease}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}}
.modal-h{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.modal-h .x{border:0;background:transparent;font-size:16px;cursor:pointer;color:var(--muted);padding:2px 6px;border-radius:6px}
.modal-h .x:hover{background:#f2f3f5;color:var(--ink)}
.modal-b{padding:12px 14px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.draft-item{display:flex;justify-content:space-between;align-items:center;gap:10px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;transition:border-color .15s}
.draft-item:hover{border-color:var(--line-strong)}
.di-name{font-size:13px;font-weight:600}
.di-meta{font-size:11px;color:var(--muted);margin-top:2px}
.di-ops{display:flex;gap:6px;flex:none}
.empty{color:var(--muted);font-size:13px;text-align:center;padding:32px 0}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%) translateY(16px);background:#1c1f24;color:#fff;font-size:13px;padding:9px 18px;border-radius:99px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.25);max-width:80vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
<style id="css-paper">
/* ================= 纸张 / 文件本体（FIA 赛事干事文书版式，打印与导出复用） ================= */
.paper{width:210mm;min-height:297mm;background:#fff;box-shadow:0 10px 34px rgba(16,24,40,.16);padding:16mm 15mm 14mm;font-family:"Helvetica Neue",Helvetica,Arial,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;color:#14171c;position:absolute;top:0;left:0;line-height:1.72}
/* ---------- 报头：赛事名 + 机构 + 编号（仿 FIA 决定书首页） ---------- */
.fia-mast{display:flex;justify-content:space-between;align-items:flex-start;gap:18px;padding-bottom:9px;border-bottom:2.5px solid #14171c}
.fm-l{display:flex;gap:13px;align-items:center;min-width:0}
.emblem{width:50px;height:50px;flex:none}
.fm-event{font-size:16px;font-weight:700;letter-spacing:.5px;line-height:1.35;text-transform:uppercase}
.lang-zh .fm-event{letter-spacing:1px}
.fm-org{font-size:9.5px;letter-spacing:1.8px;color:#3a3f46;margin-top:5px;font-weight:700;text-transform:uppercase}
.fm-date{font-size:9.5px;letter-spacing:1.2px;color:#6a7078;margin-top:2px}
.fm-no{text-align:right;flex:none}
.fm-no .k{font-size:8.5px;letter-spacing:2.2px;color:#7a8088;font-weight:700}
.fm-no .v{font-size:15px;font-weight:700;margin-top:2px;letter-spacing:.5px;color:#14171c}
/* ---------- 收发信息表：From / To / Date / Time（仿 FIA 四栏信息表） ---------- */
.fia-meta{width:100%;border-collapse:collapse;margin-top:0;font-size:11px;line-height:1.6}
.fia-meta td{border:1px solid #14171c;padding:5px 9px;vertical-align:top}
.fia-meta td.k{font-weight:700;white-space:nowrap;width:1%;font-size:9px;letter-spacing:1.6px;color:#14171c;text-transform:uppercase}
.lang-zh .fia-meta td.k{letter-spacing:2.5px;font-size:10px}
.mono{font-family:Georgia,"Times New Roman",serif;font-size:12px;letter-spacing:.4px}
/* ---------- 导语与文种标题 ---------- */
.preamble{font-size:11.5px;line-height:1.8;text-align:justify;margin:13px 0 4px}
.doc-type-title{font-size:14px;font-weight:700;text-align:center;letter-spacing:.32em;margin:15px 0 3px;margin-right:-.32em;text-transform:uppercase}
.doc-type-sub{text-align:center;font-size:10px;color:#6a7078;letter-spacing:.04em;margin-bottom:8px;line-height:1.6}
.doc-type-sub.en{font-family:Georgia,"Times New Roman",serif;letter-spacing:.08em;text-transform:uppercase}
/* ---------- FIA 式字段表：左列粗体标签 + 右列内容，黑细边框 ---------- */
.fia-table{width:100%;border-collapse:collapse;margin:7px 0 4px}
.fia-table td{border:1px solid #14171c;padding:6px 10px;vertical-align:top;font-size:11.5px;line-height:1.75}
.fia-table td.k{width:16%;font-weight:700;font-size:9px;letter-spacing:1.6px;text-transform:uppercase;white-space:nowrap;color:#14171c}
.lang-zh .fia-table td.k{letter-spacing:2.5px;font-size:10px}
.fia-table .doc-p{font-size:11.5px;margin:0 0 3px}
.fia-table .doc-p:last-child{margin-bottom:0}
.cell-line{line-height:1.7}
.cell-line+.cell-line{margin-top:2px}
.cell-desc{font-size:10.5px;color:#3a3f46;line-height:1.65;margin-top:1px}
.lang-en .doc-p{text-indent:0}
.lang-en .doc-p+.doc-p{margin-top:4px}
/* ---------- 正文段落 ---------- */
.doc-p{font-size:11.5px;line-height:1.85;text-align:justify;margin:0 0 5px;text-indent:2em}
.doc-p.en-p{font-size:10.5px;color:#4a5058;line-height:1.75;margin-top:2px;text-indent:0}
/* ---------- 结果公示表 ---------- */
.doc-table{width:100%;border-collapse:collapse;font-size:11px;margin:9px 0}
.doc-table th{background:#f4f4f5;border:1px solid #14171c;padding:5px 8px;font-size:9.5px;letter-spacing:1.5px;font-weight:700;color:#14171c;text-transform:uppercase}
.doc-table td{border:1px solid #3a3f46;padding:5px 9px;text-align:center;line-height:1.55}
.doc-table td.l{text-align:left}
.sub{font-size:9.5px;color:#7c828a;margin-top:1px;line-height:1.45;font-family:Georgia,"Times New Roman",serif}
.pen-chips{margin:2px 0 6px}
.pen-chip{display:inline-block;border:1px solid #9C2126;color:#9C2126;border-radius:99px;padding:2px 12px;font-size:10.5px;margin:2px 5px 2px 0;letter-spacing:.5px;background:#fdf7f7}
.att-list{list-style:none;padding:0;margin:3px 0}
.att-list li{font-size:11.5px;line-height:1.8;position:relative;padding-left:74px}
.att-no{position:absolute;left:0;top:0;color:#5a6068;font-size:10px;letter-spacing:1px}
.ph{color:#b9bec7}
.ph2{color:#c3c8cf;font-size:13px}
/* ---------- 申诉提示（仿 FIA 决定书末尾的权利提示段） ---------- */
.appeal-note{font-size:10px;line-height:1.75;color:#454b54;text-align:justify;margin:11px 0 0;padding-top:8px;border-top:1px solid #c9ced6}
.appeal-note .doc-p{font-size:10px;color:#454b54;text-indent:0}
/* ---------- 通知记录（仿 FIA “Competitor notified” 行） ---------- */
.notify-row{display:flex;justify-content:flex-end;font-size:9.5px;color:#454b54;margin-top:16px;letter-spacing:.5px}
/* ---------- 签名区：名单横排 + 机构行（仿 FIA “The Stewards”） ---------- */
.sig-org{font-size:11px;font-weight:700;color:#14171c;margin:14px 0 9px;letter-spacing:2.5px;text-align:center;text-transform:uppercase}
.lang-zh .sig-org{letter-spacing:4px}
.signatures{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:12px 28px;margin-top:4px}
.sig-block{text-align:center;min-width:0}
.sig-block .who{font-size:12.5px;font-weight:700;color:#14171c;line-height:1.35;letter-spacing:.5px}
.sig-block .t{margin-top:2px;font-size:9.5px;color:#454b54;letter-spacing:.8px;line-height:1.5}
.sig-date{text-align:center;font-size:10px;color:#454b54;margin-top:14px;letter-spacing:1.2px}
/* ================= 打印 ================= */
@media print{
  body{overflow:visible;background:#fff}
  .topbar,.editor,.pv-toolbar,.modal-mask,.toast{display:none!important}
  .main{display:block;height:auto}
  .preview-wrap{overflow:visible;padding:0;display:block;background:#fff}
  .paper-sizer{width:auto!important;height:auto!important;margin:0!important;animation:none}
  .paper{position:static!important;transform:none!important;width:auto!important;min-height:0!important;box-shadow:none!important;margin:0!important;padding:0!important}
  .fia-table tr,.fia-meta tr,.sig-block,.doc-table tr,.att-list li{break-inside:avoid}
  .doc-type-title{break-after:avoid}
  @page{size:A4;margin:16mm 15mm}
}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="brand-mark" id="brandMark" aria-hidden="true">O</div>
    <div>
      <div class="brand-name">OfficialDoc<span class="brand-sub" id="brandSub">Official Document Portal</span></div>
      <div class="brand-dept" id="brandDept">GUIS-ULC Student Office · Official Documents</div>
    </div>
  </div>
  <span class="ver" id="verBadge">v1.2</span>
  <nav class="typebar" id="typebar" aria-label="Document type"></nav>
  <div class="actions">
    <div class="seg" id="uiSeg" role="group" aria-label="Interface language">
      <button data-act="uilang" data-v="zh">中文</button>
      <button data-act="uilang" data-v="en" class="on">EN</button>

function applyTypeDefaults(s){
  var T=TITLES[s.type]||TITLES.decision,d=s.doc,en=s.lang==='en';
  if(!s.meta.from)s.meta.from=en?(T.fromEn||T.from):T.from;

  autoTitle(s);
  if(!d.appeal)d.appeal=en?(T.appealEn||''):T.appeal;
  if(!d.appealEn)d.appealEn=T.appealEn||'';
  if(!d.effective)d.effective=en?(T.effectiveEn||''):T.effective;

function autoNo(){
  var m=/(\d+)\s*$/.exec(state.meta.no||'');
  var seq=m?parseInt(m[1],10)+1:(storedSeq+1);
  storedSeq=seq;try{localStorage.setItem(KEY_SEQ,String(seq));}catch(e){}
  var y=(state.meta.date||'').slice(0,4)||String(new Date().getFullYear());
  state.meta.no=state.org.prefix+'-'+y+'-('+'000'+seq+')'.slice(-4);
}

function ta(bind,rows,ph,chip,isEn){
  return '<div class="in-row">'+(chip?'<span class="lang-chip">'+chip+'</span>':'')
    +'<textarea rows="'+rows+'" class="'+(isEn?'en-in':'')+'" data-bind="'+bind+'" placeholder="'+esc(trp(ph)||'')+'">'+esc(gp(bind))+'</textarea></div>';
}
/* 按文档语言渲染输入：en→英文框；zh→中文框；bi→中文框+英文框（堆叠） */
function langInp(bindZ,bindE,ph,listZ,listE){
  var L=state.lang;
  if(L==='en')return inp(bindE,gp(bindE),ph,'',true,listE);
  if(L==='zh')return inp(bindZ,gp(bindZ),ph,'',false,listZ);
  return inp(bindZ,gp(bindZ),ph,'中文',false,listZ)+inp(bindE,gp(bindE),ph,'EN',true,listE);
}
function langTa(bindZ,bindE,rows,ph){
  var L=state.lang;
  if(L==='en')return ta(bindE,rows,ph,'',true);
  if(L==='zh')return ta(bindZ,rows,ph,'');
  return ta(bindZ,rows,ph,'中文')+ta(bindE,rows,ph,'EN',true);
}
function fInp(label,bind,ph,withEn){
  return '<div class="fld"><span class="fld-l">'+tr(label)+'</span>'
    +(withEn===false?inp(bind,gp(bind),ph,''):langInp(bind,bind+'En',ph))+'</div>';

    +'<tr><td class="k">'+k('密级','Classification')+'</td><td>'+clsV+'</td><td class="k">'+k('文件类型','Doc. Type')+'</td><td>'+esc(L==='en'?TT.en:TT.zh)+'</td></tr>'
    +'</table>';
}
/* 文种标题（居中大写加粗）+ 描述性副标题（自动生成的关于……） */
function titleHTML(){
  var s=state,L=s.lang,T=TITLES[s.type]||TITLES.decision;
  if(L==='bi'){
    var h='<div class="doc-type-title">'+esc(T.zh)+'</div>';
    if(s.doc.title)h+='<div class="doc-type-sub">'+esc(s.doc.title)+'</div>';
    if(s.doc.titleEn)h+='<div class="doc-type-sub en">'+esc(s.doc.titleEn)+'</div>';
    return h;
  }
  var main=L==='en'?T.en:T.zh;
  var sub=L==='en'?(s.doc.titleEn||''):(s.doc.title||'');
  return '<div class="doc-type-title">'+esc(main)+'</div>'+(sub?'<div class="doc-type-sub">'+esc(sub)+'</div>':'');
}
/* 各文种导语（仿 FIA “The Stewards, having received a report…”） */
function preambleHTML(){
  var T=TITLES[state.type]||TITLES.decision,L=state.lang;
  var txt=L==='en'?(T.preambleEn||T.preamble||''):(T.preamble||'');
  if(!txt)return '';
  return '<div class="preamble">'+nl(txt)+'</div>';
}
function valTxt(v,en){
  if(!v&&!en)return '<span class="ph">————</span>';
  if(state.lang==='en')return esc(en||v);
  if(state.lang==='zh')return esc(v);
  return esc(v)+(en?'<div class="sub">'+esc(en)+'</div>':'');
}
/* 内容值按文档语言取值：en→英文（缺省回退中文）；zh→中文；bi→中文+英文副行 */
function cv(z,e,ph){
  ph=ph||'——';
  var L=state.lang;
  if(L==='en'){var v=e||z;return v?esc(v):'<span class="ph">'+ph+'</span>';}
  if(L==='zh'){return z?esc(z):'<span class="ph">'+ph+'</span>';}
  var h=z?esc(z):'<span class="ph">'+ph+'</span>';
  if(e)h+='<div class="sub">'+esc(e)+'</div>';
  return h;
}
/* 单元格短文本：两者皆空时返回 ''（FIA 表跳过空行） */
function cellTxt(z,e){
  var L=state.lang;
  if(!z&&!e)return '';
  if(L==='en')return esc(e||z);
  if(L==='zh')return esc(z);
  return esc(z||e)+(e&&z&&e!==z?'<div class="sub">'+esc(e)+'</div>':'');
}
function nl(t){
  var r=String(t||'').split(/\n+/).map(function(x){return x.trim();}).filter(Boolean).map(esc).join('</p><p class="doc-p">');
  return r||'<span class="ph">————</span>';
}
function p(zh,en){
  var L=state.lang,h='';
  if(L!=='en')h+='<p class="doc-p">'+nl(zh)+'</p>';
  if(L!=='zh'&&en&&String(en).trim())h+='<p class="doc-p en-p">'+nl(en)+'</p>';
  if(L==='en'&&(!en||!String(en).trim())&&zh&&String(zh).trim())h='<p class="doc-p">'+nl(zh)+'</p>';
  return h;
}
/* FIA 式字段表：左列粗体标签 + 右列内容；空值行自动跳过 */
function fiaTable(rows){
  var h='<table class="fia-table">';
  rows.forEach(function(r){
    if(!r||!r.v)return;
    var lab=state.lang==='en'?r.en:(state.lang==='zh'?r.zh:r.zh+' '+r.en);
    h+='<tr><td class="k">'+esc(lab)+'</td><td class="v">'+r.v+'</td></tr>';
  });
  return h+'</table>';
}
/* 学生名单单元格：多人时逐行列出 */
function studentsCell(){
  var ps=arr('parties').filter(function(x){return (x.name||'').trim()||(x.nameEn||'').trim()||(x.role||'').trim()||(x.roleEn||'').trim();});
  if(!ps.length)return '';
  var L=state.lang;
  return ps.map(function(x,i){
    var nm=cv(x.name,x.nameEn,'——');
    var rl=L==='en'?(x.roleEn||x.role||''):(x.role||x.roleEn||'');
    return '<div class="cell-line">'+(ps.length>1?(i+1)+'. ':'')+nm+(rl?' — '+esc(rl):'')+'</div>';
  }).join('');
}
/* 违规依据单元格：条款编号 + 摘要 */
function regsCell(){
  var s=state,rs=arr('regs').filter(function(x){return (x.code||'').trim()||(x.codeEn||'').trim()||(x.desc||'').trim()||(x.descEn||'').trim();});
  if(!rs.length)return '';
  return rs.map(function(x,i){
    var code=s.lang==='en'?(x.codeEn||x.code||('Art. '+(i+1))):(x.code||('（条款 '+(i+1)+'）'));
    var desc='';
    if(s.lang==='en')desc=(x.descEn||x.desc)?esc(x.descEn||x.desc):'';
    else if(s.lang==='zh')desc=x.desc?esc(x.desc):'';
    else desc=(x.desc?esc(x.desc):'')+(x.descEn?'<div class="sub">'+esc(x.descEn)+'</div>':'');
    return '<div class="cell-line"><b>'+esc(code)+'</b>'+(desc?'<div class="cell-desc">'+desc+'</div>':'')+'</div>';
  }).join('');
}
function penChips(){
  var sel=state.doc.penaltyTypes||[];
  if(!sel.length)return '';
  return '<div class="pen-chips">'+sel.map(function(v){
    var pt=PENALTIES.filter(function(x){return x.v===v;})[0];
    return pt?'<span class="pen-chip">'+(state.lang==='en'?pt.en:pt.zh)+'</span>':'';
  }).join('')+'</div>';
}
function attachList(){
  var as=arr('attachments'),aes=state.attachmentsEn||[],rows=[];
  as.forEach(function(a,i){
    var e=aes[i]||'';
    if(!String(a||'').trim()&&!String(e||'').trim())return;
    rows.push('<li><span class="att-no">'+(state.lang==='en'?'Attachment ':'附件 ')+(rows.length+1)+'</span>'+cv(a,e)+'</li>');
  });
  if(!rows.length)return '';
  return '<ul class="att-list">'+rows.join('')+'</ul>';
}
function resultsTable(){
  var s=state,L=s.lang,rs=arr('resultRows').filter(function(r){return (r.name||'').trim()||(r.nameEn||'').trim()||(r.result||'').trim()||(r.resultEn||'').trim()||(r.remark||'').trim()||(r.remarkEn||'').trim();});
  var head='<tr><th style="width:11%">'+(L==='en'?'No.':'序号')+'</th><th>'+(L==='en'?'Name / Class':'姓名 / 班级')+'</th><th style="width:22%">'+(L==='en'?'Result':'结果')+'</th><th style="width:27%">'+(L==='en'?'Remarks':'备注')+'</th></tr>';
  if(!rs.length)return '<table class="doc-table"><thead>'+head+'</thead><tbody><tr><td colspan="4" class="ph">————</td></tr></tbody></table>';
  var b=rs.map(function(r){
    return '<tr><td>'+esc(r.rank||'—')+'</td><td>'+cv(r.name,r.nameEn)+'</td><td class="mono">'+cv(r.result,r.resultEn)+'</td><td class="l">'+cv(r.remark,r.remarkEn)+'</td></tr>';
  }).join('');
  return '<table class="doc-table"><thead>'+head+'</thead><tbody>'+b+'</tbody></table>';
}
/* 生效说明（字段表后小段） */
function effectiveNote(){
  var d=state.doc;
  if(!String(d.effective||'').trim()&&!String(d.effectiveEn||'').trim())return '';
  return '<div class="preamble">'+p(d.effective,d.effectiveEn)+'</div>';
}
/* 申诉权利提示（仿 FIA 决定书末尾的申诉提醒段） */
function appealNote(){
  var d=state.doc;
  if(!String(d.appeal||'').trim()&&!String(d.appealEn||'').trim())return '';
  return '<div class="appeal-note">'+p(d.appeal,d.appealEn)+'</div>';
}
function bodyDecision(){
  var d=state.doc;
  return fiaTable([
    {zh:'学生',en:'STUDENT(S)',v:studentsCell()},
    {zh:'时间',en:'TIME',v:d.incTime?esc(d.incTime):''},

    {zh:'地点',en:'LOCATION',v:cellTxt(d.incPlace,d.incPlaceEn)},

  ])+effectiveNote()+appealNote();
}
function bodySummons(){
  var d=state.doc;
  return fiaTable([
    {zh:'被约谈人',en:'PERSON SUMMONED',v:cellTxt(d.summoned,d.summonedEn)},
    {zh:'班级 / 年级',en:'CLASS / GRADE',v:cellTxt(d.summonedRole,d.summonedRoleEn)},
    {zh:'约谈事由',en:'REASON',v:p(d.reason,d.reasonEn)},
    {zh:'到校时间',en:'APPEARANCE TIME',v:cellTxt(d.appearWhen)},
    {zh:'谈话地点',en:'PLACE',v:cellTxt(d.appearWhere,d.appearWhereEn)},

function bodyPenalty(){
  var d=state.doc;
  return fiaTable([
    {zh:'学生',en:'STUDENT(S)',v:studentsCell()},
    {zh:'违纪事实',en:'FACT',v:p(d.infringement,d.infringementEn)},
    {zh:'违规依据',en:'INFRINGEMENT',v:regsCell()},
    {zh:'处分决定',en:'DECISION',v:penChips()+p(d.penaltyDetail,d.penaltyDetailEn)},
    {zh:'执行期限',en:'EXECUTION',v:cellTxt(d.execDeadline,d.execDeadlineEn)}
  ])+effectiveNote()+appealNote();
}
function bodyBulletin(){
  var d=state.doc;
  return fiaTable([
    {zh:'正文',en:'NOTICE',v:p(d.body,d.bodyEn)},
    {zh:'附件',en:'ATTACHMENTS',v:attachList()}
  ])+effectiveNote()+appealNote();
}
function bodyResults(){
  var d=state.doc;
  return fiaTable([
    {zh:'公示项目',en:'CATEGORY',v:cellTxt(d.resultCategory,d.resultCategoryEn)},
    {zh:'公示名单',en:'RESULTS',v:resultsTable()}
  ])+effectiveNote()+appealNote();
}
/* 签名区：通知记录行 + 机构名 + 签发人名单横排（仿 FIA “The Stewards”） */
function signHTML(){
  var s=state,L=s.lang;
  var offs=arr('officials').filter(function(o){return (o.name||'').trim()||(o.nameEn||'').trim()||(o.title||'').trim()||(o.titleEn||'').trim();});
  if(!offs.length)offs=[{name:'',nameEn:'',title:L==='en'?'':'学生处干事',titleEn:L==='en'?'Student Affairs Officer':''}];
  var blocks=offs.map(function(o){
    var nm=L==='en'?(o.nameEn||o.name):(o.name||o.nameEn);
    var who=nm?esc(nm):'<span class="ph2">'+(L==='en'?'(to be signed)':'（待签署）')+'</span>';
    if(L==='bi'&&o.name&&o.nameEn&&o.name!==o.nameEn)who=esc(o.name)+'<div class="sub">'+esc(o.nameEn)+'</div>';
    var ttl=L==='en'?(o.titleEn||o.title||''):(o.title||'');
    return '<div class="sig-block"><div class="who">'+who+'</div>'+(ttl?'<div class="t">'+esc(ttl)+'</div>':'')+'</div>';
  }).join('');
  var deptTxt=L==='en'?(s.org.deptEn||s.org.dept||'The Student Office'):(s.org.dept||'学生处');
  var notify=L==='en'?'Notified to the student and parents: ☐ Yes — Date: __________':'已通知学生及家长：☐ 是　日期：__________';
  return '<div class="notify-row">'+esc(notify)+'</div>'
    +'<div class="sig-org">'+esc(deptTxt)+'</div>'
    +'<div class="signatures">'+blocks+'</div>'
    +'<div class="sig-date">'+(L==='en'?'Date of Issue: ':'签发日期：')+fmtDate(s.meta.date)+'</div>';
}
function renderPaper(){
  var s=state;
  paper.className='paper lang-'+s.lang;
  var h=headHTML()+metaHTML()+titleHTML()+preambleHTML();
  if(s.type==='decision')h+=bodyDecision();
  else if(s.type==='summons')h+=bodySummons();
  else if(s.type==='penalty')h+=bodyPenalty();
  else if(s.type==='bulletin')h+=bodyBulletin();
  else h+=bodyResults();
  paper.innerHTML=h+signHTML();
  layoutZoom();
}

/* ================= 缩放 ================= */
var zoom=1;
function setZoom(z){zoom=Math.max(.3,Math.min(1.6,z));layoutZoom();}
function fitZoom(){var w=pvWrap.clientWidth-64;zoom=Math.max(.3,Math.min(1,w/paper.offsetWidth));layoutZoom();}
function layoutZoom(){
  paper.style.transform='scale('+zoom+')';
  pvSizer.style.width=(paper.offsetWidth*zoom)+'px';
  pvSizer.style.height=(paper.offsetHeight*zoom)+'px';
  $('#zoomLabel').textContent=Math.round(zoom*100)+'%';
}

var editor=$('#editor'),paper=$('#paper'),pvWrap=$('#pvWrap'),pvSizer=$('#pvSizer'),draftMask=$('#draftMask');
var saveTimer=null;
function scheduleSave(){clearTimeout(saveTimer);saveTimer=setTimeout(function(){try{localStorage.setItem(KEY_CUR,JSON.stringify(state));}catch(e){}},400);}
function renderAll(){renderForm();renderPaper();updateTranslateBtn();}
function setType(t){
  if(!TYPE_MAP[t]||state.type===t)return;
  state.type=t;applyTypeDefaults(state);
  $$('#typebar .pill').forEach(function(b){b.classList.toggle('active',b.getAttribute('data-v')===t);});
  renderAll();scheduleSave();
}
function togglePen(v){
  var list=state.doc.penaltyTypes||(state.doc.penaltyTypes=[]);
  var i=list.indexOf(v);
  if(i>=0)list.splice(i,1);else list.push(v);
  renderAll();scheduleSave();
}
function addRow(key){
  var a=arr(key);
  if(key==='parties')a.push({name:'',nameEn:'',role:'',roleEn:'',no:''});
  else if(key==='regs')a.push({code:'',codeEn:'',desc:'',descEn:''});
  else if(key==='officials')a.push({name:'',nameEn:'',title:'学生处干事',titleEn:'Student Affairs Officer'});
  else if(key==='resultRows')a.push({rank:String(a.length+1),name:'',nameEn:'',result:'',resultEn:'',remark:'',remarkEn:''});
  else if(key==='attachments'){a.push('');(state.attachmentsEn||(state.attachmentsEn=[])).push('');}
  else a.push('');
  renderAll();scheduleSave();
}
function delRow(key,i){
  var a=arr(key);
  if(a.length<=1){toast(L2('至少保留一行','At least one row is required'));return;}
  a.splice(i,1);
  if(key==='attachments'){var ae=state.attachmentsEn||[];ae.splice(i,1);}
  renderAll();scheduleSave();
}
function handleAct(act){
  var a=act.getAttribute('data-act');
  if(a==='type')setType(act.getAttribute('data-v'));
  else if(a==='lang'){state.lang=act.getAttribute('data-v');syncLangSeg();renderAll();scheduleSave();}
  else if(a==='cls'){state.meta.cls=act.getAttribute('data-v');renderAll();scheduleSave();}
  else if(a==='pen')togglePen(act.getAttribute('data-v'));
  else if(a==='title-edit'){state.doc.titleCustom=true;renderForm();scheduleSave();toast(L2('已切换为手动标题','Switched to manual title'));}
  else if(a==='title-auto'){state.doc.titleCustom=false;autoTitle(state);renderAll();scheduleSave();toast(L2('已恢复自动生成标题','Switched back to auto title'));}
  else if(a==='add')addRow(act.getAttribute('data-list'));
  else if(a==='del')delRow(act.getAttribute('data-list'),+act.getAttribute('data-i'));
  else if(a==='autono'){autoNo();renderAll();scheduleSave();toast(L2('已生成编号：','Number generated: ')+state.meta.no);}
  else if(a==='uilang'){
    var nu=act.getAttribute('data-v');
    if(nu===uiLang)return;
    uiLang=nu;try{localStorage.setItem(KEY_UI,uiLang);}catch(e){}
    var synced=false;
    if(state.lang!=='bi'){var want=nu==='en'?'en':'zh';synced=state.lang!==want;state.lang=want;}
    applyChrome();buildTypebar();syncUiSeg();syncLangSeg();renderAll();scheduleSave();
    if(synced)toast(nu==='en'
      ?L2('已切换为英文界面，文档语言同步为英文（中文内容已保留）','Switched to the English interface; document language set to English (Chinese content is preserved)')
      :L2('已切换为中文界面，文档语言同步为中文（英文内容已保留）','Switched to the Chinese interface; document language set to Chinese (English content is preserved)'));
    else toast(nu==='en'?L2('界面语言：英文','Interface language: English'):L2('界面语言：中文','Interface language: Chinese'));
  }
  else if(a==='automi'){
    state.autoMT=!state.autoMT;updateAutoMTBtn();scheduleSave();
    toast(state.autoMT
      ?L2('自动翻译已开启：编辑一侧，另一语言自动填充','Auto-translate on: editing one side auto-fills the other language')
      :L2('自动翻译已关闭','Auto-translate off'));
  }
  else if(a==='zoom-in')setZoom(zoom+.1);
  else if(a==='zoom-out')setZoom(zoom-.1);
  else if(a==='zoom-fit')fitZoom();
  else if(a==='close-drafts')draftMask.hidden=true;
  else if(a==='load-draft')loadDraft(+act.getAttribute('data-id'));
  else if(a==='del-draft')delDraft(+act.getAttribute('data-id'));
}

/* ================= 草稿 / 导入导出 ================= */
function loadDrafts(){try{return JSON.parse(localStorage.getItem(KEY_DRAFTS)||'[]');}catch(e){return [];}}
function saveDrafts(list){try{localStorage.setItem(KEY_DRAFTS,JSON.stringify(list));}catch(e){toast('保存失败：存储空间不足');}}
function saveDraft(){
  var list=loadDrafts();
  var name=(state.doc.title||typeName(state.type))+' · '+(state.meta.no||L2('未编号','unnumbered'));
  list.unshift({id:Date.now(),name:name,at:new Date().toISOString(),state:JSON.parse(JSON.stringify(state))});
  saveDrafts(list);toast(L2('已保存草稿：','Draft saved: ')+name);
}
function openDrafts(){
  var list=loadDrafts(),box=$('#draftList');
  if(!list.length)box.innerHTML='<div class="empty">'+tr('暂无草稿。<br>点击「保存草稿」即可将当前文件存入草稿箱。')+'</div>';
  else box.innerHTML=list.map(function(d){
    return '<div class="draft-item"><div class="di-txt"><div class="di-name">'+esc(d.name)+'</div><div class="di-meta">'
      +new Date(d.at).toLocaleString(uiLang==='en'?'en-GB':'zh-CN',{hour12:false})+' · '+esc(d.state&&d.state.meta?d.state.meta.no:'')+' · '+(TYPE_MAP[d.state&&d.state.type]?typeName(d.state.type):'')+'</div></div>'
      +'<div class="di-ops"><button class="mini-btn" data-act="load-draft" data-id="'+d.id+'">'+tr('载入')+'</button><button class="mini-btn danger" data-act="del-draft" data-id="'+d.id+'">'+tr('删除')+'</button></div></div>';
  }).join('');
  draftMask.hidden=false;
}
function loadDraft(id){
  var list=loadDrafts(),d=list.filter(function(x){return x.id===id;})[0];
  if(!d||!d.state)return;
  var s=normalizeState(Object.assign(blank(),d.state));
  if(!TYPE_MAP[s.type])s.type='decision';
  state=s;applyTypeDefaults(state);
  draftMask.hidden=true;syncTypebar();syncLangSeg();renderAll();toast(L2('已载入草稿','Draft loaded'));
}
function delDraft(id){
  saveDrafts(loadDrafts().filter(function(x){return x.id!==id;}));
  openDrafts();toast(L2('已删除','Deleted'));
}
function exportJson(){
  download(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),'officialdoc-'+(state.meta.no||'draft')+'.json');
  toast(L2('已导出 JSON 备份','JSON backup exported'));
}
function exportHtml(){
  var css=$('#css-paper').textContent;
  var doc='<!DOCTYPE html><html lang="'+(state.lang==='en'?'en':'zh-CN')+'"><head><meta charset="utf-8">'
    +'<title>'+esc(state.meta.no||state.doc.title||'Official Document')+'</title>'
    +'<style>'+css+'\nbody{margin:0;background:#eef0f3;display:flex;justify-content:center;padding:26px 0}'
    +'\n.paper{position:static;transform:none}'
    +'\n@media print{body{background:#fff;padding:0;display:block}.paper{box-shadow:none;margin:0;padding:0;width:auto;min-height:0}@page{size:A4;margin:16mm 15mm}}</style>'
    +'</head><body>'+paper.outerHTML+'</body></html>';
  download(new Blob([doc],{type:'text/html'}),'doc-'+(state.meta.no||'document')+(state.lang==='en'?'-en':state.lang==='zh'?'-zh':'-bi')+'.html');
  toast(L2('已导出独立 HTML 文档','Standalone HTML document exported'));
}

/* ================= 机器翻译（免密钥公开接口） =================
   主用 Google 翻译 gtx 免密端点，失败自动回退 MyMemory；两者均返回
   Access-Control-Allow-Origin: *，可直接在浏览器端调用、无需任何密钥。
   若网络无法访问（如部分地区），会提示手动填写，不影响其他功能。 */
var MT_FIELDS=[
  ['org.name','org.nameEn'],['org.dept','org.deptEn'],
  ['meta.from','meta.fromEn'],['meta.to','meta.toEn'],
  ['doc.event','doc.eventEn'],['doc.matter','doc.matterEn'],['doc.session','doc.sessionEn'],['doc.title','doc.titleEn'],
  ['doc.facts','doc.factsEn'],['doc.incSession','doc.incSessionEn'],['doc.incPlace','doc.incPlaceEn'],
  ['doc.decision','doc.decisionEn'],
  ['doc.summoned','doc.summonedEn'],['doc.summonedRole','doc.summonedRoleEn'],['doc.reason','doc.reasonEn'],
  ['doc.appearWhere','doc.appearWhereEn'],['doc.consequence','doc.consequenceEn'],
  ['doc.infringement','doc.infringementEn'],['doc.penaltyDetail','doc.penaltyDetailEn'],['doc.execDeadline','doc.execDeadlineEn'],
  ['doc.body','doc.bodyEn'],['doc.resultCategory','doc.resultCategoryEn'],
  ['doc.effective','doc.effectiveEn'],['doc.appeal','doc.appealEn']
];
var MT_LISTS={
  parties:{name:'nameEn',role:'roleEn'},
  regs:{code:'codeEn',desc:'descEn'},
  officials:{name:'nameEn',title:'titleEn'},
  resultRows:{name:'nameEn',result:'resultEn',remark:'remarkEn'}
};
var MT_Z2E={},MT_E2Z={};
MT_FIELDS.forEach(function(f){MT_Z2E[f[0]]=f[1];MT_E2Z[f[1]]=f[0];});
/* 输入框绑定路径 → 翻译方向；该字段没有可翻译的对应字段时返回 null */
function mtPair(bind){
  if(!bind)return null;
  var m;
  if(MT_E2Z[bind])return {src:bind,dst:MT_E2Z[bind],from:'en',to:'zh'};
  if(MT_Z2E[bind])return {src:bind,dst:MT_Z2E[bind],from:'zh',to:'en'};
  m=/^(attachments|attachmentsEn)\.(\d+)$/.exec(bind);
  if(m)return m[1]==='attachments'
    ?{src:bind,dst:'attachmentsEn.'+m[2],from:'zh',to:'en'}
    :{src:bind,dst:'attachments.'+m[2],from:'en',to:'zh'};
  m=/^(parties|regs|officials|resultRows)\.(\d+)\.(.+)$/.exec(bind);
  if(m){
    var L=MT_LISTS[m[1]],f=m[3],isEn=f.slice(-2)==='En',base=isEn?f.slice(0,-2):f;
    if(L&&L[base]!==undefined){
      return isEn
        ?{src:bind,dst:m[1]+'.'+m[2]+'.'+base,from:'en',to:'zh'}
        :{src:bind,dst:m[1]+'.'+m[2]+'.'+base+'En',from:'zh',to:'en'};
    }
  }
  return null;
}
/* 长文本按段落/句子切块，尽量不拆断语义；块间用空串拼接（段落内换行尽量保留在同块） */
function chunkText(text,max){
  text=String(text||'');
  if(!text)return [];
  if(text.length<=max)return [text];
  var out=[],cur='';
  function flush(){if(cur){out.push(cur);cur='';}}
  text.split('\n').forEach(function(para){
    if(para.length<=max){
      if(cur.length+(cur?1:0)+para.length>max)flush();
      cur+=(cur?'\n':'')+para;
    }else{
      flush();
      var sents=para.match(/[^。！？；.!?;]+[。！？；.!?;]?\s*/g)||[para];
      sents.forEach(function(s){
        if(s.length>max){flush();for(var i=0;i<s.length;i+=max)out.push(s.slice(i,i+max));return;}
        if(cur.length+s.length>max)flush();
        cur+=s;
      });
      flush();
    }
  });
  flush();
  return out;
}
var MT_CACHE={};
function mtGoogle(text,from,to,signal){
  var url='https://translate.googleapis.com/translate_a/single?client=gtx&sl='+encodeURIComponent(from)+'&tl='+encodeURIComponent(to)+'&dt=t&q='+encodeURIComponent(text);
  return fetch(url,signal?{signal:signal}:undefined).then(function(r){
    if(!r.ok)throw new Error('http '+r.status);
    return r.json();
  }).then(function(j){
    var segs=j&&j[0];
    if(!segs||!segs.length)throw new Error('bad response');
    return segs.map(function(s){return s[0];}).join('');
  });
}
function mtMyMemory(text,from,to,signal){
  var url='https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair='+encodeURIComponent(from+'|'+to);
  return fetch(url,signal?{signal:signal}:undefined).then(function(r){
    if(!r.ok)throw new Error('http '+r.status);
    return r.json();
  }).then(function(j){
    var t=j&&j.responseData&&j.responseData.translatedText;
    if(!t||/MYMEMORY WARNING|QUERY LENGTH LIMIT|INVALID LANGUAGE PAIR/i.test(t))throw new Error('bad response');
    return t;
  });
}
function mtFetch(fn,text,from,to){
  var ctrl=typeof AbortController!=='undefined'?new AbortController():null;
  var timer=ctrl?setTimeout(function(){ctrl.abort();},9000):null;
  return fn(text,from,to,ctrl?ctrl.signal:undefined).then(function(r){
    if(timer)clearTimeout(timer);
    if(!r||!String(r).trim())throw new Error('empty');
    return r;
  }).catch(function(e){if(timer)clearTimeout(timer);throw e;});
}
/* 单供应商：按 max 长度分块、顺序翻译 */
function mtProvider(fn,text,from,to,max){
  var parts=chunkText(text,max),out=[];
  var p=Promise.resolve();
  parts.forEach(function(part){
    p=p.then(function(){return mtFetch(fn,part,from,to).then(function(r){out.push(r);});});
  });
  return p.then(function(){return out.join('');});
}
function translateText(text,from,to){
  var key=from+'>'+to+'>'+text;
  if(MT_CACHE[key]!==undefined)return Promise.resolve(MT_CACHE[key]);
  return mtProvider(mtGoogle,text,from,to,700).catch(function(){
    return mtProvider(mtMyMemory,text,from,to,150);
  }).then(function(r){MT_CACHE[key]=r;return r;});
}
/* _mt：记录哪些字段是机翻填充的。用户手动改过某字段后取消标记，
   再次整篇翻译时不会覆盖手写内容（只会补空 / 刷新机翻字段）。 */
function markMT(p){var m=state._mt||(state._mt=[]);if(m.indexOf(p)<0)m.push(p);}
function unmarkMT(p){var m=state._mt||[];var i=m.indexOf(p);if(i>=0)m.splice(i,1);}
function refreshTitleDisplays(){
  var d1=$('#autoTitleDisp');if(d1)d1.textContent=(state.lang==='en'?state.doc.titleEn:state.doc.title)||'';
  var d2=$('#autoTitleDispEn');if(d2)d2.textContent=state.doc.titleEn||'';
  var d3=$('#autoTitleDispZh');if(d3)d3.textContent=state.doc.title||'';
}
function syncInputValue(bind,val){
  var el=editor.querySelector('[data-bind="'+bind+'"]');
  if(el&&el.value!==val)el.value=val;
}
/* ---------- 自动翻译：编辑一侧，另一语言自动填充 ---------- */
var autoMTTimer=null,mtFailWarned=false;
function scheduleAutoMT(bind){
  if(!state.autoMT)return;
  if(!mtPair(bind))return;
  clearTimeout(autoMTTimer);
  autoMTTimer=setTimeout(function(){runAutoMT(bind);},1100);
}
function runAutoMT(bind){
  var pair=mtPair(bind);
  if(!pair)return;
  var text=String(gp(pair.src)||'');
  if(!text.trim()){sp(pair.dst,'');syncInputValue(pair.dst,'');renderPaper();scheduleSave();return;}
  translateText(text,pair.from,pair.to).then(function(out){
    sp(pair.dst,out);markMT(pair.dst);
    syncInputValue(pair.dst,out);
    if(pair.dst==='doc.eventEn'||pair.dst==='doc.matterEn'||pair.dst==='doc.event'||pair.dst==='doc.matter'){
      autoTitle(state);refreshTitleDisplays();
    }
    renderPaper();scheduleSave();
  }).catch(function(){
    if(!mtFailWarned){mtFailWarned=true;toast(L2('自动翻译失败：翻译服务暂不可用，可改用「翻译并下载」或手动填写','Auto-translate failed: the translation service is unavailable. Use “Translate & Download” or fill in manually.'));}
  });
}
/* ---------- 一键翻译并下载 ---------- */
var mtBusy=false;
function updateTranslateBtn(prog,total){
  var b=$('#btnTranslate');
  if(!b)return;
  if(mtBusy){b.disabled=true;b.textContent=L2('翻译中','Translating')+' '+(prog||0)+'/'+(total||0)+' …';return;}
  b.disabled=false;
  var toEn=state.lang!=='en';
  b.textContent=toEn?L2('翻译为英文并下载','Translate to English & Download'):L2('翻译为中文并下载','Translate to Chinese & Download');
  b.title=toEn
    ?L2('将全部中文内容机翻为英文，切换文档语言并下载英文文件','Machine-translate all Chinese content into English, switch the document language and download the English file')
    :L2('将全部英文内容机翻为中文，切换文档语言并下载中文文件','Machine-translate all English content into Chinese, switch the document language and download the Chinese file');
}
function updateAutoMTBtn(){
  var b=$('#btnAutoMT');
  if(!b)return;
  b.classList.toggle('on',!!state.autoMT);
  b.textContent=L2('自动翻译','Auto-Translate');
  b.title=state.autoMT
    ?L2('已开启：编辑一侧内容时，另一语言自动填充（点击关闭）','On: editing one side auto-fills the other language (click to turn off)')
    :L2('开启后：编辑一侧内容时，另一语言自动填充','When on, editing one side auto-fills the other language');
}
function translateAllAndDownload(){
  if(mtBusy)return;
  var to=state.lang==='en'?'zh':'en',from=to==='en'?'zh':'en';
  var jobs=[];
  function consider(src,dst,sv,dv){
    sv=String(sv||'').trim();dv=String(dv||'').trim();
    if(!sv)return;
    if(dv&&(state._mt||[]).indexOf(dst)<0)return;
    jobs.push({src:src,dst:dst,text:sv});
  }
  MT_FIELDS.forEach(function(f){
    var src=to==='en'?f[0]:f[1],dst=to==='en'?f[1]:f[0];
    if(dst==='doc.title'||src==='doc.title'){if(!state.doc.titleCustom)return;}
    consider(src,dst,gp(src),gp(dst));
  });
  Object.keys(MT_LISTS).forEach(function(key){
    arr(key).forEach(function(it,i){
      Object.keys(MT_LISTS[key]).forEach(function(f){
        var ef=MT_LISTS[key][f];
        var src=to==='en'?key+'.'+i+'.'+f:key+'.'+i+'.'+ef;
        var dst=to==='en'?key+'.'+i+'.'+ef:key+'.'+i+'.'+f;
        consider(src,dst,it[to==='en'?f:ef],it[to==='en'?ef:f]);
      });
    });
  });
  arr('attachments').forEach(function(a,i){
    var en=(state.attachmentsEn||[])[i];
    if(to==='en')consider('attachments.'+i,'attachmentsEn.'+i,a,en);
    else consider('attachmentsEn.'+i,'attachments.'+i,en,a);
  });
  if(!jobs.length){toast(L2('没有可翻译的内容','Nothing to translate'));return;}
  mtBusy=true;updateTranslateBtn(0,jobs.length);
  var done=0,failed=0;
  function finish(){
    mtBusy=false;
    autoTitle(state);
    state.lang=to;syncLangSeg();renderAll();scheduleSave();updateTranslateBtn();
    if(!done){
      toast(L2('翻译服务暂不可用，请检查网络后重试；原文已保留','The translation service is unavailable. Please check your network and retry; the original text is kept.'));
      return;
    }
    exportHtml();
    var msg=done+L2(' 个字段已翻译',' field(s) translated')+'，'+L2('文档已切换为','document switched to ')+(to==='en'?L2('英文','English'):L2('中文','Chinese'))+L2(' 并下载',' and downloaded');
    if(failed)msg+=L2('；'+failed+' 个字段失败，已保留原文','; '+failed+' field(s) failed — original text kept');
    toast(msg);
  }
  (function next(idx){
    if(idx>=jobs.length){finish();return;}
    updateTranslateBtn(idx+1,jobs.length);
    translateText(jobs[idx].text,from,to).then(function(out){
      sp(jobs[idx].dst,out);markMT(jobs[idx].dst);done++;
    }).catch(function(){failed++;}).then(function(){next(idx+1);});
  })(0);
}
function normalizeState(s){
  if(!s.meta)s.meta={};
  if(!s.meta.fromEn)s.meta.fromEn='';
  if(!s.meta.toEn)s.meta.toEn='';
  if(!Array.isArray(s.attachments))s.attachments=[''];
  if(!Array.isArray(s.attachmentsEn))s.attachmentsEn=[];
  while(s.attachmentsEn.length<s.attachments.length)s.attachmentsEn.push('');
  if(!Array.isArray(s._mt))s._mt=[];
  if(typeof s.autoMT!=='boolean')s.autoMT=false;
  return s;
}

/* ================= 初始化 ================= */
var state=example();
(function init(){
  try{var cur=localStorage.getItem(KEY_CUR);if(cur){var s=JSON.parse(cur);if(s&&s.meta&&s.doc){state=normalizeState(Object.assign(blank(),s));toast(tr('已恢复上次编辑内容'));}}}catch(e){}
  if(!TYPE_MAP[state.type])state.type='decision';
  applyTypeDefaults(state);
  if(!state.meta.no)autoNo();
  applyChrome();buildTypebar();syncLangSeg();syncUiSeg();renderAll();updateAutoMTBtn();fitZoom();
  bindInputs();
  $('#btnExample').addEventListener('click',function(){state=example();applyTypeDefaults(state);syncTypebar();syncLangSeg();renderAll();toast(tr('已载入示例文件'));});
  $('#btnNew').addEventListener('click',function(){state=blank();autoNo();applyTypeDefaults(state);syncTypebar();syncLangSeg();renderAll();toast(tr('已新建空白文件'));});
  $('#btnSave').addEventListener('click',saveDraft);
  $('#btnDrafts').addEventListener('click',openDrafts);
  $('#btnExportJson').addEventListener('click',exportJson);
  $('#btnImportJson').addEventListener('click',function(){$('#fileInput').click();});
  $('#btnExportHtml').addEventListener('click',exportHtml);
  $('#btnPrint').addEventListener('click',function(){window.print();});
  $('#btnTranslate').addEventListener('click',translateAllAndDownload);
  $('#fileInput').addEventListener('change',function(e){
    var f=e.target.files&&e.target.files[0];if(!f)return;
    var r=new FileReader();
    r.onload=function(){
      try{
        var s=JSON.parse(r.result);
        if(!s||!s.meta||!s.doc)throw new Error('bad format');
        if(!TYPE_MAP[s.type])s.type='decision';
        state=normalizeState(Object.assign(blank(),s));applyTypeDefaults(state);
        syncTypebar();syncLangSeg();renderAll();toast(L2('导入成功','Import successful'));
      }catch(err){toast(L2('导入失败：文件格式不正确','Import failed: invalid file format'));}
      e.target.value='';
    };
    r.readAsText(f);
  });
  draftMask.addEventListener('click',function(e){if(e.target===draftMask)draftMask.hidden=true;});
  document.addEventListener('keydown',function(e){
    if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='s'){e.preventDefault();saveDraft();}
  });
  var rzT=null;
  window.addEventListener('resize',function(){clearTimeout(rzT);rzT=setTimeout(fitZoom,150);});
})();
})();
</script>
